app = "crossy-app"
primary_region = "dfw"

[build]

[env]
  PORT = "3000"
  DATABASE_PATH = "/data/crossy.db"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = "15s"
    timeout = "2s"
    grace_period = "5s"
    method = "GET"
    path = "/api/health"

# Persistent SQLite volume. One machine, one volume.
[mounts]
  source = "crossy_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
